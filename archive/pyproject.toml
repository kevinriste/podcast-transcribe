[project]
name = "archive"
version = "0.1.0"
description = "Scheduled intake for a blog/archive (one post per day)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "podcast-shared",
    "requests>=2.34.2",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.60.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.20.0",
    "ruff>=0.7.0",
]

[tool.ruff]
extend = "../pyproject.toml"

[tool.basedpyright]
extends = "../pyproject.toml"

[tool.uv.sources]
podcast-shared = { path = "../shared" }
