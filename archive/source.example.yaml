# Source configuration for the scheduled archive-intake tool (check-archive.py).
#
# Copy to source.yaml (gitignored) and set your source's display name. If
# source.yaml is absent, the display name falls back to "Archive".
#
# posts.json (gitignored) holds the chronological list of posts to walk through,
# one per day; each entry is {"title": ..., "url": ...}.

# Display name written to META_FROM for every episode from this source.
source_name: Example Blog

# Path to the JSON list of posts (default: posts.json).
posts_file: posts.json

# Optional CSS selector for the element holding each post's body (e.g. "div.entry-content").
# With it, the page HTML goes through prepare-text's HTML stage like a newsletter email:
# quotes, tweets, tables and image descriptions are kept, and a page where the selector
# matches nothing fails loudly (Gotify alert) instead of publishing junk. Without it, the
# article text is guessed from the whole page (which can pick a sidebar over a very short
# post) and read as plain text.
# content_selector: div.entry-content
